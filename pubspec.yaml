name: apk_builder
description: يجمّع مشاريع ZIP إلى APK عبر GitHub Actions دون الدخول إلى GitHub.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  file_picker: ^8.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
